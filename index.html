<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Match Day Live</title>
<meta name="theme-color" content="#07060f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@500;600;700&family=Noto+Sans+Devanagari:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#07060f;--violet:#7c5cff;--cyan:#22e4ff;--pink:#ff3d8b;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--text:#f2f0ff;--mute:#a9a4c9;--grad:linear-gradient(120deg,#7c5cff,#22e4ff);--disp:Unbounded,'Noto Sans Devanagari',sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:Manrope,'Noto Sans Devanagari',sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* aurora backdrop */
.aurora{position:fixed;inset:0;overflow:hidden;z-index:0}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vmax;height:46vmax;background:var(--violet);left:-12vmax;top:-14vmax}
.aurora i:nth-child(2){width:38vmax;height:38vmax;background:#0aa6c9;right:-10vmax;bottom:-12vmax;animation-delay:-6s}
.aurora i:nth-child(3){width:26vmax;height:26vmax;background:var(--pink);left:40%;top:55%;opacity:.26;animation-delay:-11s}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.15)}}
.screen{position:fixed;inset:0;z-index:1;display:grid;place-items:center;padding:24px;overflow:auto;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s}
.screen.on{opacity:1;visibility:visible}

/* intro */
#intro{text-align:center;cursor:pointer}
.mark{width:112px;height:112px;margin:0 auto 30px}
.mark svg{width:100%;height:100%;overflow:visible}
.ring{stroke:url(#g);stroke-width:3;stroke-dasharray:302;stroke-dashoffset:302;animation:draw 1.4s .2s cubic-bezier(.6,0,.2,1) forwards;filter:drop-shadow(0 0 10px #22e4ff)}
@keyframes draw{to{stroke-dashoffset:0}}
.tri{fill:#fff;stroke:none;opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s 1.1s forwards;filter:drop-shadow(0 0 12px #7c5cff)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#intro h1{font:700 clamp(2.6rem,9vw,5.4rem)/1 var(--disp);letter-spacing:-.02em;text-shadow:0 0 40px rgba(124,92,255,.8)}
#intro h1 span{display:inline-block;opacity:0;transform:translateY(45%);filter:blur(10px);animation:rise .7s calc(1.2s + var(--i)*.06s) cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
#intro p{margin-top:18px;color:var(--mute);font-size:1.05rem;opacity:0;animation:fade .8s 2.1s forwards}
.load{width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);margin:34px auto 0;overflow:hidden;opacity:0;animation:fade .4s 1.2s forwards}
.load b{display:block;height:100%;width:0;background:var(--grad);box-shadow:0 0 12px #22e4ff;animation:fill 2.2s 1.3s ease-in-out forwards}
@keyframes fill{to{width:100%}}
@keyframes fade{to{opacity:1}}
.skip{margin-top:22px;font-size:.8rem;color:var(--mute);opacity:0;animation:fade .6s 2.4s forwards}

/* stream select */
#select{text-align:center;align-content:center;gap:34px}
#select h2{font:700 clamp(1.7rem,4.8vw,2.7rem)/1.15 var(--disp)}
#select .sub{color:var(--mute);margin-top:12px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,310px));gap:22px;justify-content:center}
@media(max-width:700px){.cards{grid-template-columns:minmax(0,340px)}}
.card{--mx:50%;--my:50%;position:relative;text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:28px;padding:28px;background:var(--glass);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(124,92,255,.38),transparent 60%);opacity:0;transition:opacity .3s}
.card:hover,.card:focus-visible{transform:translateY(-6px);border-color:rgba(34,228,255,.6);box-shadow:0 24px 60px -20px rgba(124,92,255,.75);outline:none}
.card:hover::before,.card:focus-visible::before{opacity:1}
.card>*{position:relative;display:block}
.glyph{width:74px;height:74px;border-radius:24px;display:grid!important;place-items:center;font:700 1.9rem var(--disp);background:var(--grad);color:#06050d;margin-bottom:48px;box-shadow:0 10px 30px -8px #7c5cff}
.card.alt .glyph{background:linear-gradient(120deg,#ff3d8b,#7c5cff);color:#fff}
.card h3{font:700 1.5rem var(--disp)}
.card .d{color:var(--mute);margin:6px 0 18px}
.pill{display:inline-flex!important;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,61,139,.14);border:1px solid rgba(255,61,139,.4);font-weight:700;font-size:.8rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}

/* player */
#player{padding:0}
.wrap{width:min(1120px,100%);padding:16px}
.stage{position:relative;aspect-ratio:16/9;width:100%;background:#000;border-radius:26px;overflow:hidden;border:1px solid var(--line);box-shadow:0 40px 120px -30px rgba(124,92,255,.7);user-select:none;-webkit-user-select:none}
.stage video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.stage:fullscreen{border-radius:0;border:0;aspect-ratio:auto}
.stage.full{position:fixed;inset:0;width:100%;height:100dvh;aspect-ratio:auto;border-radius:0;border:0;z-index:20}
.stage.rot{position:fixed;top:0;left:0;width:100vh;height:100vw;width:100dvh;height:100dvw;aspect-ratio:auto;border-radius:0;border:0;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);transform:translateX(100dvw) rotate(90deg);z-index:20}
.stage.idle{cursor:none}
.hint{margin-top:14px;text-align:center;color:var(--mute);font-size:.82rem}
@media(hover:none){.hint{display:none}}

.top,.bar{position:absolute;left:0;right:0;z-index:3;display:flex;gap:12px;padding:14px 18px;transition:opacity .35s}
.top{top:0;align-items:center;background:linear-gradient(rgba(5,4,12,.88),transparent);padding-bottom:34px}
.bar{bottom:0;flex-direction:column;gap:2px;background:linear-gradient(transparent,rgba(5,4,12,.94));padding-top:38px}
.stage.idle .top,.stage.idle .bar{opacity:0;pointer-events:none}
.ttl{font:700 1rem var(--disp);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.seg button{border:0;background:none;color:var(--mute);font-weight:700;font-size:.85rem;padding:7px 16px;border-radius:999px;cursor:pointer;transition:background .25s,color .25s}
.seg .act{background:var(--grad);color:#06050d}

.ib{width:42px;height:42px;flex:none;border-radius:14px;border:0;background:none;display:grid;place-items:center;cursor:pointer;transition:background .2s}
.ib:hover,.ib:focus-visible{background:rgba(255,255,255,.15);outline:none}
.ib svg{width:23px;height:23px}
.ib.pl{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:4px}
.sp{flex:1}
.tm{font-weight:700;font-size:.88rem;margin:0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.golive{display:flex;align-items:center;gap:7px;border:1px solid rgba(255,61,139,.5);background:rgba(255,61,139,.16);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.78rem;cursor:pointer}
.golive.behind{border-color:var(--line);background:rgba(255,255,255,.1)}
.golive.behind .dot{background:#8c88a8;box-shadow:none;animation:none}
.stage.paused .i-pause,.stage:not(.paused) .i-play,.stage.muted .i-vol,.stage:not(.muted) .i-mute,.stage.isfs .i-fs,.stage:not(.isfs) .i-xfs{display:none}

input[type=range]{--tr:linear-gradient(90deg,#7c5cff,#22e4ff) 0 0/var(--p,0%) 100% no-repeat,linear-gradient(90deg,rgba(255,255,255,.4) var(--b,0%),rgba(255,255,255,.17) 0);-webkit-appearance:none;appearance:none;background:none;width:100%;height:22px;cursor:pointer;display:block}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:var(--tr)}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:var(--tr)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-4.5px;box-shadow:0 0 0 4px rgba(34,228,255,.25),0 0 14px #22e4ff;transition:transform .15s}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(34,228,255,.25),0 0 14px #22e4ff}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.3)}
input[type=range]:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
.vol{display:flex;align-items:center}
.vol input{width:0;opacity:0;transition:width .25s,opacity .25s}
.vol:hover input,.vol:focus-within input{width:92px;opacity:1}
@media(hover:none){.vol input{width:72px;opacity:1}}
@media(max-width:560px){.ib{width:36px;height:36px}.ib.pl{width:42px;height:42px}.ib svg{width:20px;height:20px}.tm{margin:0 4px;font-size:.8rem}.top,.bar{padding-inline:10px}.ttl{font-size:.85rem}.seg button{padding:6px 11px}}

.big{position:absolute;inset:0;z-index:1;display:grid;place-items:center}
.bigplay{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 0 50px rgba(124,92,255,.6);opacity:0;transform:scale(.8);transition:.3s;pointer-events:none}
.bigplay svg{width:36px;height:36px;margin-left:4px}
.stage.paused .bigplay{opacity:1;transform:none}
.stage.wait .bigplay{opacity:0}
.spin{position:absolute;inset:0;margin:auto;z-index:2;width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#22e4ff;animation:sp .8s linear infinite;display:none;pointer-events:none}
.stage.wait .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:absolute;top:72px;left:50%;transform:translateX(-50%);z-index:5;padding:8px 16px;border-radius:999px;background:rgba(10,8,22,.72);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:700;font-size:.88rem;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.menu{position:absolute;right:16px;bottom:96px;z-index:6;width:min(300px,calc(100% - 32px));padding:16px 16px 4px;border-radius:20px;background:rgba(14,11,30,.74);border:1px solid var(--line);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%)}
.menu h4{font-size:.8rem;color:var(--mute);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.82rem;cursor:pointer}
.chips .act{background:var(--grad);color:#06050d;border-color:transparent}
.err{position:absolute;inset:0;z-index:2;display:grid;place-content:center;gap:6px;text-align:center;padding:24px;background:rgba(5,4,12,.84);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.err b{font:700 1.2rem var(--disp)}
.err p{color:var(--mute)}
.err button{justify-self:center;margin-top:12px;padding:10px 24px;border-radius:999px;border:0;background:var(--grad);font-weight:700;color:#06050d;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22e4ff"/></linearGradient>
<symbol id="play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></symbol>
<symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3.4"/></symbol>
<symbol id="vol" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
<symbol id="mute" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM16 9.5l5 5M21 9.5l-5 5"/></symbol>
<symbol id="pip" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><rect x="11" y="12" width="7" height="4" rx="1" fill="currentColor"/></symbol>
<symbol id="rot" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9L20 8.5M20 4v4.5h-4.5"/></symbol>
<symbol id="fs" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></symbol>
<symbol id="xfs" viewBox="0 0 24 24"><path d="M9 4v4a1 1 0 0 1-1 1H4M20 9h-4a1 1 0 0 1-1-1V4M15 20v-4a1 1 0 0 1 1-1h4M4 15h4a1 1 0 0 1 1 1v4"/></symbol>
<symbol id="set" viewBox="0 0 24 24"><path d="M3 6h9m4 0h5M3 12h3m4 0h11M3 18h13m4 0h1"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
<symbol id="back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="b10" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9L4 8.5M4 4v4.5h4.5"/><text x="12" y="15.4" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">10</text></symbol>
<symbol id="f10" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9L20 8.5M20 4v4.5h-4.5"/><text x="12" y="15.4" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">10</text></symbol>
</defs></svg>

<div class="aurora"><i></i><i></i><i></i></div>

<!-- 1. INTRO -->
<section class="screen on" id="intro">
  <div>
    <div class="mark"><svg viewBox="0 0 112 112"><circle class="ring" cx="56" cy="56" r="48"/><path class="tri" d="M46 36v40l32-20z"/></svg></div>
    <h1 id="word" aria-label="Match Day"></h1>
    <p>Live match, apni bhasha mein.</p>
    <div class="load"><b></b></div>
    <div class="skip">Tap karke skip karo</div>
  </div>
</section>

<!-- 2. STREAM SELECT -->
<section class="screen" id="select">
  <div>
    <h2>Commentary chuno</h2>
    <p class="sub">Match ke beech mein bhi badal sakte ho.</p>
  </div>
  <div class="cards">
    <button class="card" data-k="hindi"><span class="glyph">हि</span><h3>Hindi</h3><span class="d">हिन्दी कमेंट्री, पूरे जोश के साथ</span><span class="pill"><i class="dot"></i>Live</span></button>
    <button class="card alt" data-k="english"><span class="glyph">En</span><h3>English</h3><span class="d">Full English commentary</span><span class="pill"><i class="dot"></i>Live</span></button>
  </div>
</section>

<!-- 3. PLAYER -->
<section class="screen" id="player">
  <div class="wrap">
    <div class="stage paused" id="stage">
      <video id="v" playsinline preload="auto"></video>
      <div class="big" id="big"><div class="bigplay"><svg><use href="#play"/></svg></div></div>
      <div class="spin"></div>
      <div class="err" id="err" hidden><b>Stream nahi chal rahi</b><p id="errmsg">Link check karo ya dobara try karo.</p><button id="retry">Retry</button></div>
      <div class="toast" id="toast"></div>

      <div class="top">
        <button class="ib" id="back" aria-label="Back"><svg><use href="#back"/></svg></button>
        <div class="ttl" id="ttl"></div>
        <div class="seg"><button data-k="hindi">Hindi</button><button data-k="english">English</button></div>
      </div>

      <div class="menu" id="menu" hidden>
        <div id="qg"><h4>Quality</h4><div class="chips" id="ql"></div></div>
        <h4>Speed</h4><div class="chips" id="sl"></div>
      </div>

      <div class="bar">
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
        <div class="row">
          <button class="ib pl" id="pp" aria-label="Play or pause"><svg class="i-play"><use href="#play"/></svg><svg class="i-pause"><use href="#pause"/></svg></button>
          <button class="ib" id="bk" aria-label="Back 10 seconds"><svg><use href="#b10"/></svg></button>
          <button class="ib" id="fw" aria-label="Forward 10 seconds"><svg><use href="#f10"/></svg></button>
          <div class="vol">
            <button class="ib" id="mu" aria-label="Mute"><svg class="i-vol"><use href="#vol"/></svg><svg class="i-mute"><use href="#mute"/></svg></button>
            <input type="range" id="vl" min="0" max="1" step="0.01" value="1" aria-label="Volume">
          </div>
          <span class="tm" id="tm">0:00</span>
          <button class="golive" id="gl" hidden><i class="dot"></i>LIVE</button>
          <span class="sp"></span>
          <button class="ib" id="st" aria-label="Settings"><svg><use href="#set"/></svg></button>
          <button class="ib" id="pip" aria-label="Picture in picture"><svg><use href="#pip"/></svg></button>
          <button class="ib" id="rt" aria-label="Rotate"><svg><use href="#rot"/></svg></button>
          <button class="ib" id="fs" aria-label="Fullscreen"><svg class="i-fs"><use href="#fs"/></svg><svg class="i-xfs"><use href="#xfs"/></svg></button>
        </div>
      </div>
    </div>
    <p class="hint">Space play/pause · M mute · F fullscreen · P PiP · R rotate · ← → 10s · L live</p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
/* ============ APNE STREAM URLS YAHAN DAALO ============ */
const STREAMS = {
  hindi:   { title: 'Hindi Commentary',   url: 'https://livecfdai-mp.slivcdn.com/out/v1/mpchgp431f/mpch50d3/cricodi_2710-hin-3-ts-hls/std-mdd-600300010_3.m3u8?hdntl=exp=1793126052~acl=*~hmac=b563f02e6d5f2d7395e648a5ac7e66efb7b8f87ce683922ee573fb32d8a2f353&originpath=/linear/hls/pb/event/alWqozasSNeEIxePgYc3Og/stream/a4c928ca-1a63-4789-b344-ce42fb3b0534:TPE2/variant/d89ff0e63b6bfbe52014fec5fb07b209/bandwidth/791296.m3u8' },
  english: { title: 'English Commentary', url: 'https://livecfdai-mp.slivcdn.com/out/v1/mpchgp431f/mpchc653/cricodi_2710-eng-3-ts-hls/std-mdd-600300010_3.m3u8?hdntl=exp=1793125821~acl=*~hmac=f9d0ad57fdf2f9534a28ef022ee71b2dc72f6afc82c17c03aeb021148d1f1db7&originpath=/linear/hls/pb/event/V1tapABJTSOCEfSvJXTwNQ/stream/b9ccc094-053a-490a-88f1-a0b25b5e159f:SIN2/variant/87b3052785f6b124a49d1c4fcde6fc44/bandwidth/791296.m3u8' }
};
/* ======================================================== */

const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const v = $('#v'), stage = $('#stage'), seek = $('#seek'), vl = $('#vl'), tm = $('#tm'), gl = $('#gl'), menu = $('#menu');
let hls = null, cur = 'hindi', rmode = 0, retries = 0, dragging = false, idleT, toastT, clickT, introDone = false;
const show = id => $$('.screen').forEach(s => s.classList.toggle('on', s.id === id));

/* ---------- intro ---------- */
$('#word').innerHTML = [...'Match Day'].map((c, i) => `<span style="--i:${i}">${c === ' ' ? '&nbsp;' : c}</span>`).join('');
function endIntro() { if (introDone) return; introDone = true; show('select'); }
$('#intro').onclick = endIntro;
setTimeout(endIntro, 3700);

/* ---------- select ---------- */
$$('.card').forEach(c => {
  c.onmousemove = e => { const r = c.getBoundingClientRect(); c.style.setProperty('--mx', e.clientX - r.left + 'px'); c.style.setProperty('--my', e.clientY - r.top + 'px'); };
  c.onclick = () => { show('player'); load(c.dataset.k); wake(); };
});
$$('.seg button').forEach(b => b.onclick = () => b.dataset.k !== cur && load(b.dataset.k));

/* ---------- helpers ---------- */
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 1200); }
const fmt = t => { t = Math.max(0, Math.floor(t)); const h = t / 3600 | 0, m = t % 3600 / 60 | 0, s = t % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
const range = () => { const s = v.seekable; return s.length ? [s.start(0), s.end(s.length - 1)] : [0, isFinite(v.duration) ? v.duration : 0]; };
const isLive = () => !isFinite(v.duration) || !!(hls && hls.levels[Math.max(0, hls.currentLevel)]?.details?.live);
const mark = (c, b) => c.querySelectorAll('button').forEach(x => x.classList.toggle('act', x === b));
const chip = (box, label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => { fn(); mark(box, b); }; box.append(b); return b; };

/* ---------- load stream ---------- */
function load(key) {
  cur = key; retries = 0;
  $('#ttl').textContent = STREAMS[key].title;
  $$('.seg button').forEach(b => b.classList.toggle('act', b.dataset.k === key));
  $('#err').hidden = true; stage.classList.add('wait');
  if (hls) { hls.destroy(); hls = null; }
  v.removeAttribute('src'); v.load();
  const url = STREAMS[key].url;
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ lowLatencyMode: true, backBufferLength: 90 });
    hls.loadSource(url); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, (_, d) => { buildQuality(d.levels); v.play().catch(() => {}); });
    hls.on(Hls.Events.FRAG_LOADED, () => retries = 0);
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR && retries < 3) { retries++; setTimeout(() => hls && hls.startLoad(), 1500); }
      else if (d.type === Hls.ErrorTypes.MEDIA_ERROR && retries < 3) { retries++; hls.recoverMediaError(); }
      else fail();
    });
    $('#qg').hidden = false;
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
    $('#qg').hidden = true; v.src = url; v.play().catch(() => {});
    v.onerror = () => fail();
  } else fail('Is browser mein HLS support nahi hai.');
}
function fail(msg) { stage.classList.remove('wait'); $('#errmsg').textContent = msg || 'Link check karo ya dobara try karo.'; $('#err').hidden = false; }
$('#retry').onclick = () => load(cur);

function buildQuality(levels) {
  const q = $('#ql'); q.innerHTML = '';
  mark(q, chip(q, 'Auto', () => { hls.currentLevel = -1; toast('Quality: Auto'); }));
  q.firstChild.classList.add('act');
  levels.map((l, i) => [l.height ? l.height + 'p' : Math.round(l.bitrate / 1000) + 'k', i]).reverse()
    .forEach(([t, i]) => chip(q, t, () => { hls.currentLevel = i; toast('Quality: ' + t); }));
}
const sl = $('#sl');
[0.5, 1, 1.25, 1.5, 2].forEach(r => { const b = chip(sl, r + 'x', () => { v.playbackRate = r; toast('Speed: ' + r + 'x'); }); if (r === 1) b.classList.add('act'); });

/* ---------- playback state ---------- */
const toggle = () => v.paused ? v.play().catch(() => {}) : v.pause();
const skip = d => { const [a, b] = range(); v.currentTime = Math.min(b, Math.max(a, v.currentTime + d)); toast((d > 0 ? '+' : '') + d + 's'); };
const goLive = () => { const [, b] = range(); v.currentTime = hls && hls.liveSyncPosition ? hls.liveSyncPosition : b - 1; };
v.onplay = v.onpause = v.onended = () => stage.classList.toggle('paused', v.paused);
v.onwaiting = () => stage.classList.add('wait');
v.onplaying = v.oncanplay = () => stage.classList.remove('wait');
v.onplaying = () => { stage.classList.remove('wait'); $('#err').hidden = true; wake(); };
v.ontimeupdate = v.onprogress = v.ondurationchange = v.onseeked = update;
function update() {
  const [a, b] = range(), len = b - a || 1, p = Math.min(1, Math.max(0, (v.currentTime - a) / len));
  if (!dragging) seek.value = p * 1000;
  seek.style.setProperty('--p', (dragging ? seek.value / 10 : p * 100) + '%');
  let buf = 0;
  for (let i = 0; i < v.buffered.length; i++) if (v.buffered.start(i) <= v.currentTime + .5 && v.buffered.end(i) >= v.currentTime) buf = v.buffered.end(i);
  seek.style.setProperty('--b', Math.min(100, Math.max(0, (buf - a) / len * 100)) + '%');
  const live = isLive(); gl.hidden = !live;
  if (live) { const lag = b - v.currentTime; tm.textContent = lag > 8 ? '-' + fmt(lag) : 'Live'; gl.classList.toggle('behind', lag > 8); }
  else tm.textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration || 0);
}
seek.onpointerdown = () => dragging = true;
addEventListener('pointerup', () => dragging = false);
seek.oninput = () => { const [a, b] = range(); v.currentTime = a + seek.value / 1000 * (b - a); seek.style.setProperty('--p', seek.value / 10 + '%'); };
gl.onclick = goLive;
$('#pp').onclick = toggle; $('#bk').onclick = () => skip(-10); $('#fw').onclick = () => skip(10);

/* ---------- volume ---------- */
try { const s = parseFloat(localStorage.getItem('md_vol')); if (s >= 0 && s <= 1) v.volume = s; } catch (e) {}
vl.oninput = () => { v.volume = +vl.value; v.muted = v.volume === 0; };
v.onvolumechange = () => {
  const lv = v.muted ? 0 : v.volume;
  stage.classList.toggle('muted', lv === 0); vl.value = lv; vl.style.setProperty('--p', lv * 100 + '%');
  try { localStorage.setItem('md_vol', v.volume); } catch (e) {}
};
$('#mu').onclick = () => { if (v.muted || v.volume === 0) { v.muted = false; if (v.volume === 0) v.volume = .5; } else v.muted = true; };
const vstep = d => { v.muted = false; v.volume = Math.min(1, Math.max(0, +(v.volume + d).toFixed(2))); toast('Volume ' + Math.round(v.volume * 100) + '%'); };
v.onvolumechange();

/* ---------- PiP ---------- */
if (!document.pictureInPictureEnabled && !v.webkitSetPresentationMode) $('#pip').hidden = true;
async function pip() {
  try {
    if (document.pictureInPictureEnabled) document.pictureInPictureElement ? await document.exitPictureInPicture() : await v.requestPictureInPicture();
    else v.webkitSetPresentationMode(v.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
  } catch (e) { toast('PiP abhi available nahi hai'); }
}
$('#pip').onclick = pip;

/* ---------- fullscreen + rotate ---------- */
const fsOn = () => document.fullscreenElement === stage || stage.classList.contains('full');
const syncFs = () => stage.classList.toggle('isfs', fsOn());
async function fs() {
  if (fsOn()) { if (document.fullscreenElement) await document.exitFullscreen().catch(() => {}); stage.classList.remove('full'); }
  else if (stage.requestFullscreen) { try { await stage.requestFullscreen(); } catch (e) { stage.classList.add('full'); } }
  else stage.classList.add('full');
  syncFs();
}
document.onfullscreenchange = () => { if (!document.fullscreenElement && rmode === 1) { rmode = 0; try { screen.orientation.unlock(); } catch (e) {} } syncFs(); };
async function rotate() {
  if (rmode === 1) { rmode = 0; try { screen.orientation.unlock(); } catch (e) {} if (document.fullscreenElement) document.exitFullscreen(); return toast('Portrait'); }
  if (rmode === 2) { rmode = 0; stage.classList.remove('rot'); return toast('Portrait'); }
  if (matchMedia('(pointer:coarse)').matches && screen.orientation && screen.orientation.lock) {
    try { if (!document.fullscreenElement && stage.requestFullscreen) await stage.requestFullscreen(); await screen.orientation.lock('landscape'); rmode = 1; return toast('Landscape'); } catch (e) {}
  }
  rmode = 2; stage.classList.add('rot'); toast('Rotated');
}
$('#fs').onclick = fs; $('#rt').onclick = rotate;

/* ---------- settings menu ---------- */
$('#st').onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; };
stage.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target)) menu.hidden = true; });

/* ---------- tap / click on video ---------- */
$('#big').onclick = e => {
  const hidden = stage.classList.contains('idle');
  wake();
  if (hidden && e.pointerType === 'touch') return;
  clearTimeout(clickT); clickT = setTimeout(toggle, 230);
};
$('#big').ondblclick = e => {
  clearTimeout(clickT);
  const r = e.currentTarget.getBoundingClientRect(), x = rmode === 2 ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
  x < .33 ? skip(-10) : x > .67 ? skip(10) : fs();
};

/* ---------- auto-hide controls ---------- */
function wake() {
  stage.classList.remove('idle'); clearTimeout(idleT);
  idleT = setTimeout(() => { if (!v.paused && menu.hidden) stage.classList.add('idle'); }, 3000);
}
['pointermove', 'pointerdown', 'keydown'].forEach(n => stage.addEventListener(n, wake));
v.addEventListener('pause', wake);

/* ---------- back ---------- */
$('#back').onclick = async () => {
  v.pause(); if (hls) { hls.destroy(); hls = null; } v.removeAttribute('src'); v.load();
  if (document.fullscreenElement) await document.exitFullscreen().catch(() => {});
  if (rmode === 1) try { screen.orientation.unlock(); } catch (e) {}
  rmode = 0; stage.classList.remove('rot', 'full'); menu.hidden = true; syncFs(); show('select');
};

/* ---------- keyboard ---------- */
addEventListener('keydown', e => {
  if (!$('#player').classList.contains('on') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key, onRange = e.target.type === 'range';
  if (onRange && k.startsWith('Arrow')) return;
  const map = { ' ': toggle, k: toggle, m: () => $('#mu').click(), f: fs, p: pip, r: rotate, l: goLive, ArrowLeft: () => skip(-10), ArrowRight: () => skip(10), ArrowUp: () => vstep(.05), ArrowDown: () => vstep(-.05),
    Escape: () => { stage.classList.remove('full'); if (rmode === 2) rotate(); syncFs(); } };
  if (map[k]) { if (e.target.tagName === 'BUTTON' && k === ' ') return; e.preventDefault(); map[k](); }
});
</script>
</body>
</html>
